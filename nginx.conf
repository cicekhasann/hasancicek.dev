server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Güvenlik başlıkları (Traefik secHeaders@file ile de pekiştirilir)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Gizli dosyalara (.git, .env vb.) erişimi engelle
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Statik varlıklar önbellek (hash'siz dosyalar için makul süre)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Ana rota ve Özel Hata Sayfaları (404 / 403 / 500)
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    # Sağlık kontrolü
    location = /health {
        access_log off;
        return 200 '{"status":"ok","app":"portfolio"}\n';
        add_header Content-Type application/json;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
